apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-base
  namespace: argocd
spec:
  sources:
    - repoURL: https://github.com/MyChaOS87/sloth.git
      targetRevision: main
      path: argocd-base
    - repoURL: git@github.com:MyChaOS87/sloth-private.git
      targetRevision: main
      path: argocd-base
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  project: argocd-base
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: argocd-base
  namespace: argocd
spec:
  description: Argocd Project
  sourceRepos:
    - https://github.com/MyChaOS87/sloth.git
    - git@github.com:MyChaOS87/sloth-private.git
    - https://argoproj.github.io/argo-helm
  destinations:
    - namespace: argocd
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  orphanedResources:
    warn: false
