apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      targetRevision: 10.14.0
      chart: argo-cd
      helm:
        valueFiles:
          - $private/values/argocd.yaml
        values: |
          global:
            networkPolicy:
              create: false
          dex:
            enabled: false
          configs:
            params:
              server.insecure: true
            rbac:
              policy.csv: |
                g, admins, role:admin
          server:
            ingress:
              annotations:
                cert-manager.io/cluster-issuer: letsencrypt
              enabled: true
              tls: true
    - repoURL: git@github.com:MyChaOS87/sloth-private.git
      targetRevision: main
      ref: private
    - repoURL: git@github.com:MyChaOS87/sloth-private.git
      targetRevision: main
      path: argocd-base/argocd-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  project: argocd-base
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true

