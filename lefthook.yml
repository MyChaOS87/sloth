pre-commit:
  commands:
    leak-guard-staged:
      run: ./scripts/check-blacklist.sh --warn --staged
    yaml-lint:
      run: 'make --no-print-directory check.yaml || { echo "WARN: yamlfmt check failed (will block on pre-push)"; true; }'
    manifest-policy:
      run: 'make --no-print-directory check.manifests || { echo "WARN: conftest manifest policy failed (will block on pre-push)"; true; }'

commit-msg:
  commands:
    leak-guard-commit-msg:
      run: ./scripts/check-blacklist.sh --warn --commit-msg {1}

pre-push:
  commands:
    leak-guard-pre-push:
      use_stdin: true
      run: ./scripts/check-blacklist.sh --pre-push
    gitops-check:
      run: make --no-print-directory check
