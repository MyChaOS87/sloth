apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: system-upgrade
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  destination:
    namespace: system-upgrade
    server: https://kubernetes.default.svc
  project: cluster-essentials
  sources:
    - repoURL: "https://github.com/rancher/system-upgrade-controller.git"
      targetRevision: v0.21.0
      path: .
    - repoURL: https://github.com/MyChaOS87/sloth.git
      targetRevision: main
      path: cluster-essentials/system-upgrade-config
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
