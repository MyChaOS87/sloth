apiVersion: v1
kind: Namespace
metadata:
  name: sealed-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
# do not create this namespace here as system-upgrade definitely wants to do that itself
# ---
# apiVersion: v1
# kind: Namespace
# metadata:
