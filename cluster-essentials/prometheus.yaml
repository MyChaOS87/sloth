apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  destination:
    namespace: prometheus
    server: https://kubernetes.default.svc
  project: cluster-essentials
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      # Pinned below prometheus-operator v0.95.0/v0.95.1 (bundled through chart 29.47.2), whose
      # linux/arm64 manifest shipped an amd64 binary (prometheus-operator/prometheus-operator#8953,
      # fixed in >= v0.95.2). Verify with `make check.images` before bumping past 29.41.0.
      targetRevision: 29.41.0
      chart: prometheus
      helm:
        valueFiles:
          - $private/values/prometheus.yaml
        values: |
          server:
            ingress:
              annotations:
                cert-manager.io/cluster-issuer: letsencrypt
                traefik.ingress.kubernetes.io/router.middlewares: oidc-chain-authelia-auth@kubernetescrd
              enabled: true
            persistentVolume:
              enabled: true
              size: 100Gi
              storageClass: longhorn
          prometheus-node-exporter:
            nodeSelector:
              node-role.kubernetes.io/monitoring: "true"
            tolerations:
              - effect: NoSchedule
                operator: Exists
              - key: dedicated
                operator: Exists
    - repoURL: git@github.com:MyChaOS87/sloth-private.git
      targetRevision: main
      ref: private
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
