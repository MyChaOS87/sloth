apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
spec:
  destination:
    namespace: prometheus
    server: https://kubernetes.default.svc
  project: cluster-essentials
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 27.42.2
    chart: prometheus
    helm:
      values: |
        server:
          ingress:
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt
            enabled: true
            hosts: 
              - prometheus.internal.k8s.example.com
              - prometheus.rock.k8s.example.com
            tls: 
              - secretName: prometheus-rock-k8s-example-com-tls
                hosts: 
                  - prometheus.internal.k8s.example.com
                  - prometheus.rock.k8s.example.com
          persistentVolume:
            enabled: true
            size: 100Gi
            storageClass: longhorn
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
