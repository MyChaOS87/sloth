# Agent plan for non-Kairos edge nodes (pi0-lcn).
# Keep version in lockstep with cluster-essentials/kairos-operator-config/kairos-os.yaml (enforced by policy/upgrades.rego).
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: agent-plan
  namespace: system-upgrade
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  concurrency: 1
  cordon: true
  version: v1.37.2+k3s1
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: DoesNotExist
      - key: kairos.io/managed
        operator: DoesNotExist
  tolerations:
    - key: dedicated
      operator: Exists
  serviceAccountName: system-upgrade
  upgrade:
    image: rancher/k3s-upgrade
