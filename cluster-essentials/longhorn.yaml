apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
spec:
  sources:
    - repoURL: https://charts.longhorn.io
      targetRevision: 1.13.0
      chart: longhorn
      helm:
        valueFiles:
          - $private/values/longhorn.yaml
        values: |
          defaultSettings:
            createDefaultDiskLabeledNodes: true
            removeSnapshotsDuringFilesystemTrim: true
          longhornManager:
            nodeSelector:
              node-role.kubernetes.io/storage: "true"
          longhornDriver:
            nodeSelector:
              node-role.kubernetes.io/storage: "true"
          ingress:
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt
              traefik.ingress.kubernetes.io/router.middlewares: oidc-chain-authelia-auth@kubernetescrd
            enabled: true
            tls: true
    - repoURL: git@github.com:MyChaOS87/sloth-private.git
      targetRevision: main
      ref: private
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn
  project: cluster-essentials
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn-config
  namespace: argocd
spec:
  destination:
    namespace: longhorn
    server: https://kubernetes.default.svc
  project: cluster-essentials
  source:
    repoURL: https://github.com/MyChaOS87/sloth.git
    targetRevision: main
    path: cluster-essentials/longhorn-config
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
