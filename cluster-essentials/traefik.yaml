apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  source:
    repoURL: https://traefik.github.io/charts
    targetRevision: 42.3.1
    chart: traefik
    helm:
      values: |
        providers:
          kubernetesIngress:
            publishedService:
              enabled: true
        ports:
          web:
            http:
              redirections:
                entryPoint:
                  to: websecure
                  scheme: https
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  project: cluster-essentials
  syncPolicy:
    automated:
      prune: true
      selfHeal: true