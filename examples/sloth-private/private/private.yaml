apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: private
  namespace: argocd
spec:
  description: Private workloads and experimental apps isolated from the public sloth repository
  sourceRepos:
    - '*'
  destinations:
    - namespace: '*'
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
  orphanedResources:
    warn: false
