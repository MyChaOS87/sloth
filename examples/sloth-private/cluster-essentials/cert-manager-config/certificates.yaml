apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: test-internal-k8s-example-com
  namespace: cert-manager
spec:
  secretName: test-internal-k8s-example-com
  issuerRef:
    name: letsencrypt-staging
    kind: ClusterIssuer
  commonName: test.internal.k8s.example.com
  dnsNames:
    - test.internal.k8s.example.com
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: test-rock-k8s-example-com
  namespace: cert-manager
spec:
  secretName: test-rock-k8s-example-com
  issuerRef:
    name: letsencrypt-staging
    kind: ClusterIssuer
  commonName: test.rock.k8s.example.com
  dnsNames:
    - test.rock.k8s.example.com
