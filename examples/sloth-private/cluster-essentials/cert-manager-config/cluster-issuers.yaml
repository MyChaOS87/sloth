    privateKeySecretRef:
      name: letsencrypt
    solvers:
      - dns01:
          cloudDNS:
            # The ID of the GCP project
            project: example-dns
            # This is the secret used to access the service account
            serviceAccountSecretRef:
              name: gcloud-dns01-solver
              key: gcloud-dns01-solver.key.json
