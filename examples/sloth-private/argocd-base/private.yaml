apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: private
  namespace: argocd
spec:
  project: argocd-base
  source:
    repoURL: git@github.com:<you>/sloth-private.git
    targetRevision: main
    path: private
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
