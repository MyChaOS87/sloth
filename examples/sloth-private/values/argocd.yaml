configs:
  cm:
    url: https://argocd.internal.k8s.example.com
    oidc.config: |
      name: Authelia
      issuer: https://sso.internal.k8s.example.com
      clientID: argocd
      clientSecret: $argocd-client-secret:client-secret
      enablePKCEAuthentication: true
      requestedScopes: ["openid", "profile", "email", "groups"]
server:
  ingress:
    hostname: argocd.internal.k8s.example.com
    extraHosts:
      - name: argocd.rock.k8s.example.com
    extraTls:
      - hosts:
          - argocd.internal.k8s.example.com
          - argocd.rock.k8s.example.com
        secretName: argocd-rock-k8s-example-com-tls
