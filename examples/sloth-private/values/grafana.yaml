ingress:
  hosts:
    - grafana.k8s.lan
    - grafana.rock.k8s.example.com
    - grafana.internal.k8s.example.com
  tls:
    - hosts:
        - grafana.rock.k8s.example.com
        - grafana.internal.k8s.example.com
      secretName: grafana-rock-k8s-example-com-tls
grafana.ini:
  server:
    domain: grafana.internal.k8s.example.com
    root_url: https://grafana.internal.k8s.example.com
  auth.generic_oauth:
    auth_url: https://sso.internal.k8s.example.com/api/oidc/authorization
    token_url: https://sso.internal.k8s.example.com/api/oidc/token
    api_url: https://sso.internal.k8s.example.com/api/oidc/userinfo
    signout_redirect_url: https://sso.internal.k8s.example.com/logout
