# Generate the Argon2id password hash with ../../../../../sloth/create-authelia-user-hash.sh
apiVersion: v1
kind: Secret
metadata:
  name: authelia-users
  namespace: oidc
type: Opaque
stringData:
  users_database.yml: |-
    users:
      <admin-username>:
        disabled: false
        displayname: "<Admin Display Name>"
        password: "$argon2id$v=19$m=65536,t=3,p=4$c2FsdHNhbHRzYWx0c2FsdA$cGxhY2Vob2xkZXJwbGFjZWhvbGRlcnBsYWNlaG9sZGVy"
        email: "<admin@example.com>"
        groups:
          - admins
