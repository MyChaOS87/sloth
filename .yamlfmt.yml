doublestar: true
formatter:
  type: basic
  indent: 2
  include_document_start: false
  retain_line_breaks_single: true
  scan_folded_as_literal: true
  trim_trailing_whitespace: true
  eof_newline: true
exclude:
  - .cache/**
  - .secrets/**
  - tools/**
  - "**/templates/**"
  - "**/charts/**"
  - "**/*.tpl"
  - node-bootstrap/rock5b/build/**
