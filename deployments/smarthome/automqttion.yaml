apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: automqttion
  namespace: argocd
spec:
  destination:
    namespace: automqttion
    server: https://kubernetes.default.svc
  project: smarthome
  sources:
  - repoURL: https://mychaos87.github.io/automqttion
    targetRevision: 0.0.5
    chart: automqttion
    helm:
      values: |
        env:
          - name: AUTOMQTTION_MQTT_BROKER
            value: "tcp://mosquitto.mosquitto.svc.cluster.local:1883"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true