apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: automqttion
  namespace: argocd
spec:
  destination:
    namespace: automqttion
    server: https://kubernetes.default.svc
  project: smarthome
  sources:
    - repoURL: https://mychaos87.github.io/automqttion
      targetRevision: 0.0.7
      chart: automqttion
      helm:
        valueFiles:
          - $private/values/automqttion.yaml
        values: |
          env:
            - name: AUTOMQTTION_MQTT_BROKER
              value: "tcp://mosquitto.mosquitto.svc.cluster.local:1883"
    - repoURL: git@github.com:MyChaOS87/sloth-private.git
      targetRevision: main
      ref: private
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
