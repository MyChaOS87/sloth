apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mosquitto
  namespace: argocd
spec:
  destination:
    namespace: mosquitto
    server: https://kubernetes.default.svc
  project: smarthome
  source:
    repoURL: git@github.com:MyChaOS87/sloth.git
    targetRevision: main
    path: deployments/smarthome/mosquitto
    helm:
      values: |
        service:
          annotations:
            metallb.universe.tf/loadBalancerIPs: 192.168.1.30
            external-dns.alpha.kubernetes.io/hostname: mosquitto.rock.k8s.vogelherdweg.de,mosquitto.internal.k8s.vogelherdweg.de.
            external-dns.kubernetes.io/hostname: mosquitto.rock.k8s.vogelherdweg.de,mosquitto.internal.k8s.vogelherdweg.de.
          type: LoadBalancer
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  topologyKey: kubernetes.io/hostname
                  namespaces:
                    - victoria-metrics
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: victoria-metrics-single
  syncPolicy:
    automated:
      prune: true
      selfHeal: true