apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
spec:
  destination:
    namespace: grafana
    server: https://kubernetes.default.svc
  project: smarthome
  sources:
  - repoURL: https://grafana.github.io/helm-charts
    targetRevision: 7.0.11
    chart: grafana
    helm:
      values: |
        ingress:
          enabled: true
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt
          hosts: 
          - grafana.k8s.lan
          - grafana.rock.k8s.example.com
          - grafana.internal.k8s.example.com
          tls: 
          - hosts: 
            - grafana.rock.k8s.example.com
            - grafana.internal.k8s.example.com
            secretName: grafana-rock-k8s-example-com-tls
        admin:
          existingSecret: grafana-secret
        datasources:
          datatasources.yaml:
            apiVersion: 1
            datasources:
            - name: InfluxDB
              type: influxdb 
              url: "https://influx.rock.k8s.example.com"
              jsonData:
                version: Flux
                organization: "influxdata"
                defaultBucket: default
              secureJsonData: 
                token: "$INFLUX_TOKEN"
            - name: Prometheus
              type: prometheus
              url: 'https://prometheus.internal.k8s.example.com'
        envValueFrom:
          INFLUX_TOKEN:
            secretKeyRef:
              name: influxdb-secret
              key: admin-token
        dashboardProviders:
          dashboardproviders.yaml:
            apiVersion: 1
            providers:
            - name: 'default'
              orgId: 1
              folder: ''
              type: file
              disableDeletion: false
              editable: true
              options:
                path: /var/lib/grafana/dashboards/default
        dashboards:
          default:
            environment:
              url: https://example.com/grafana-dashboards/Environment.json
            power:
              url: https://example.com/grafana-dashboards/Power.json
            prometheus-stats:
              gnetId: 15489
              datasource: Prometheus
            version-checker:
              gnetId: 12833
              datasource: Prometheus
            kubernetes-cluster:
              gnetId: 15282
              datasource: Prometheus
            influxdb-stats:
              gnetId: 421
              datasource: InfluxDB
  - repoURL: git@github.com:MyChaOS87/sloth.git
    targetRevision: feature/rock5b
    path: deployments/smarthome/grafana-secrets
  - repoURL: git@github.com:MyChaOS87/sloth.git
    targetRevision: feature/rock5b
    path: deployments/smarthome/influxdb-secrets
  # syncPolicy:
  #   automated:
  #     prune: true
  #     selfHeal: true