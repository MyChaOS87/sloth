---
apiVersion: v1
kind: Namespace
metadata:
  name: oidc
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: oidc
  namespace: argocd
spec:
  description: access to the used namespaces for oidc
  sourceRepos:
  - '*'
  destinations:
  - namespace: oidc
    server: https://kubernetes.default.svc
  clusterResourceWhitelist:
  - group: '*'
    kind: '*'
  orphanedResources:
    warn: false