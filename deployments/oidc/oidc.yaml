apiVersion: v1
kind: Namespace
metadata:
  name: oidc
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: oidc
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  description: access to the used namespaces for oidc
  sourceRepos:
    - https://charts.authelia.com
    - git@github.com:MyChaOS87/sloth-private.git
  destinations:
    - namespace: oidc
      server: https://kubernetes.default.svc
  clusterResourceWhitelist: []
  orphanedResources:
    warn: false
